name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7

      - uses: jdx/mise-action@v5

      - name: Build
        run: |
          version="${GITHUB_REF_NAME#v}"
          mise run build MARKETING_VERSION="$version" CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER"

      - name: Package
        run: |
          app=build/Build/Products/Release/Brouter.app
          ditto -c -k --keepParent "$app" "Brouter-${GITHUB_REF_NAME}.zip"

          mkdir dmg
          cp -R "$app" dmg/
          ln -s /Applications dmg/Applications
          hdiutil create -volname Brouter -srcfolder dmg -format UDZO "Brouter-${GITHUB_REF_NAME}.dmg"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --generate-notes \
            "Brouter-${GITHUB_REF_NAME}.dmg" "Brouter-${GITHUB_REF_NAME}.zip"
